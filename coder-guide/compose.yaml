services:
  postgres:
    image: postgres:17-alpine
    container_name: coder-postgres
    environment:
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: coderpass
      POSTGRES_DB: coder
    volumes:
      - coder_data:/var/lib/postgresql/data
    restart: unless-stopped

  coder:
    image: ghcr.io/coder/coder:latest
    container_name: coder-local
    environment:
      CODER_PG_CONNECTION_STRING: 'postgres://coder:coderpass@coder-postgres:5432/coder?sslmode=disable'
      CODER_HTTP_ADDRESS: '0.0.0.0:3000'
      CODER_ACCESS_URL: 'http://localhost:3000'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - coder_home:/home/coder
    ports:
      - '3000:3000'
    restart: unless-stopped
    depends_on:
      - postgres

volumes:
  coder_data:
  coder_home:
